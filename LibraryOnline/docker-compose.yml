version: '3.8'

services:
  library-app:
    build: .
    container_name: libraryonline
    ports:
      - "${HOST_PORT:-8027}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    restart: unless-stopped
    volumes:
      - library-data:/app/Data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  library-data:
    driver: local